<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seating Chart — GradingGridOnline</title>
  <script>
    try {
      var savedTheme = localStorage.getItem("ggo-theme");
      if (savedTheme && savedTheme !== "default") {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    /* Layout specific to the pop-out — fills the window, no app chrome. */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 8px;
    }
    .popout-wrap {
      width: auto;
      max-width: none;
    }
    .popout-header {
      display: flex;
      align-items: baseline;
      justify-content: center;
      margin-bottom: 4px;
    }
    .popout-header h1 {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      margin: 0;
      color: var(--green-dark);
    }
    .front-label {
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      margin: 4px 0 0;
    }
    #popout-grid.seating-grid {
      gap: 4px;
    }
    .popout-status {
      color: var(--ink-soft);
      font-size: 0.9rem;
      text-align: center;
    }
    #popout-grid .desk-lock-btn,
    #popout-grid .desk-group-input,
    #popout-grid .desk-label-btn {
      display: none; /* read-only view — no controls */
    }
    #popout-grid .desk-inactive {
      border: none;
      opacity: 0;
    }
    #popout-grid .desk-name {
      font-size: var(--popout-name-size, 0.9rem);
    }
    .popout-group-badge {
      position: absolute;
      top: 2%;
      right: 3%;
      font-size: var(--popout-badge-size, 1.6rem);
      font-weight: 800;
      line-height: 1;
      color: hsl(var(--group-hue), 75%, 30%);
      font-family: var(--font-heading);
    }
    [data-theme="cyberpunk"] .popout-group-badge {
      color: hsl(var(--group-hue), 95%, 65%);
      text-shadow: 0 0 8px hsl(var(--group-hue), 95%, 55%);
    }
  </style>
</head>
<body>
  <div class="popout-wrap">
    <div class="popout-header">
      <h1 id="popout-course-title">Seating Chart</h1>
    </div>

    <p class="front-label">Front of Classroom</p>
    <div id="popout-grid" class="seating-grid"></div>

    <p id="popout-status" class="popout-status"></p>
  </div>

  <script src="js/popout.js"></script>
</body>
</html>
