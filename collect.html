<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Submit your email address</title>
  <style>
    :root {
      --paper: #f6f5f1; --ink: #2b2a28; --ink-soft: #6b6560; --green: #2f5233; --green-dark: #223d26;
      --line: #ddd8cd; --card: #ffffff; --bad: #b3261e; --good: #1e7a3c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
      font: 17px/1.5 -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      display: flex; align-items: flex-start; justify-content: center; padding: 28px 16px;
    }
    .card {
      width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 26px 22px 24px;
    }
    h1 { font: 700 1.3rem Georgia, "Times New Roman", serif; color: var(--green-dark); margin: 0 0 4px; }
    .course { color: var(--ink-soft); margin: 0 0 20px; font-size: 0.95rem; }
    label { display: block; font-weight: 600; margin: 0 0 6px; }
    input[type=text], input[type=email] {
      width: 100%; font: inherit; padding: 12px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
    }
    input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(47, 82, 51, .18); }
    input[readonly] { background: #f0eee8; color: var(--ink-soft); }
    .row { margin-bottom: 16px; }
    .hint { color: var(--ink-soft); font-size: 0.88rem; margin: 6px 0 0; }
    button.primary {
      width: 100%; font: inherit; font-weight: 600; padding: 13px; border: 0; border-radius: 8px;
      background: var(--green); color: #fff; cursor: pointer;
    }
    button.primary:disabled { opacity: .6; cursor: default; }
    button.link { background: none; border: 0; color: var(--green); font: inherit; font-size: 0.9rem; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 6px; }
    .msg { min-height: 1.4em; margin: 0 0 14px; font-size: 0.95rem; }
    .msg.bad { color: var(--bad); }
    .done { text-align: center; padding: 10px 0 4px; }
    .done .tick { font-size: 3rem; color: var(--good); line-height: 1; }
    .done h2 { margin: 10px 0 6px; font-size: 1.2rem; }
    .done p { margin: 0; color: var(--ink-soft); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Submit your email address</h1>
    <p id="course" class="course"></p>

    <p id="msg" class="msg" aria-live="polite"></p>

    <!-- Step 1: School ID -->
    <form id="id-form" novalidate hidden>
      <div class="row">
        <label for="school-id">1. Your School ID</label>
        <input id="school-id" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <p class="hint">You need your School ID to continue.</p>
      </div>
      <button id="id-btn" class="primary" type="submit">Continue</button>
    </form>

    <!-- Step 2: email (only appears after the School ID is accepted) -->
    <form id="email-form" novalidate hidden>
      <div class="row">
        <label for="school-id-locked">1. Your School ID</label>
        <input id="school-id-locked" type="text" readonly />
        <button id="change-id" class="link" type="button">That's not me / change ID</button>
      </div>
      <div class="row">
        <label for="email">2. Your email address</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" />
      </div>
      <button id="email-btn" class="primary" type="submit">Submit</button>
    </form>

    <div id="done" class="done" hidden>
      <div class="tick">✓</div>
      <h2>Thank you!</h2>
      <p>Your email address has been saved. You can close this page.</p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script>
    (function () {
      const cfg = (typeof APP_CONFIG !== "undefined" && APP_CONFIG.supabase) || {};
      const token = new URLSearchParams(location.search).get("c") || "";
      const $ = (id) => document.getElementById(id);
      const msg = $("msg");

      const MESSAGES = {
        bad_id: "That School ID isn't on this class list. Check it and try again.",
        bad_email: "That doesn't look like an email address. Check it and try again.",
        closed: "This link isn't active any more. Ask your teacher for a new QR code.",
        slow_down: "Too many wrong tries just now. Please wait a minute and try again.",
        network: "Couldn't reach the server. Check your connection and try again.",
      };

      function say(text, bad) { msg.textContent = text || ""; msg.className = "msg" + (bad ? " bad" : ""); }

      async function rpc(fn, args) {
        const headers = { "Content-Type": "application/json", apikey: cfg.anonKey };
        if (String(cfg.anonKey).startsWith("eyJ")) headers.Authorization = "Bearer " + cfg.anonKey;
        const res = await fetch(cfg.url + "/rest/v1/rpc/" + fn, { method: "POST", headers, body: JSON.stringify(args) });
        if (!res.ok) throw new Error("http " + res.status);
        return res.json();
      }

      let schoolId = "";

      function showStep(which) {
        $("id-form").hidden = which !== "id";
        $("email-form").hidden = which !== "email";
        $("done").hidden = which !== "done";
        $("course").hidden = which === "done";
        if (which === "id") $("school-id").focus();
        if (which === "email") $("email").focus();
      }

      $("id-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const value = $("school-id").value.trim();
        if (!value) { say("Type your School ID.", true); return; }
        $("id-btn").disabled = true; say("Checking…");
        try {
          const result = await rpc("collect_check", { p_token: token, p_school_id: value });
          if (result === "ok") {
            schoolId = value;
            $("school-id-locked").value = value;
            say("");
            showStep("email");
          } else {
            say(MESSAGES[result] || MESSAGES.network, true);
            if (result === "closed") $("id-form").hidden = true;
          }
        } catch (err) {
          say(MESSAGES.network, true);
        } finally {
          $("id-btn").disabled = false;
        }
      });

      $("change-id").addEventListener("click", () => {
        schoolId = ""; $("email").value = ""; say(""); showStep("id");
        $("school-id").select();
      });

      $("email-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = $("email").value.trim();
        if (!email) { say("Type your email address.", true); return; }
        $("email-btn").disabled = true; say("Saving…");
        try {
          // The server checks the School ID again here — this step can't be skipped.
          const result = await rpc("collect_submit", { p_token: token, p_school_id: schoolId, p_email: email });
          if (result === "ok") { say(""); showStep("done"); }
          else {
            say(MESSAGES[result] || MESSAGES.network, true);
            if (result === "bad_id") { schoolId = ""; showStep("id"); }
            if (result === "closed") $("email-form").hidden = true;
          }
        } catch (err) {
          say(MESSAGES.network, true);
        } finally {
          $("email-btn").disabled = false;
        }
      });

      (async function start() {
        if (!token || !cfg.url) { say(MESSAGES.closed, true); return; }
        say("Loading…");
        try {
          const course = await rpc("collect_info", { p_token: token });
          if (course === null) { say(MESSAGES.closed, true); return; }
          $("course").textContent = course;
          say("");
          showStep("id");
        } catch (err) {
          say(MESSAGES.network, true);
        }
      })();
    })();
  </script>
</body>
</html>
