<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GradingGridOnline</title>
  <script>
    // Applied before the stylesheet paints, so there's no flash of the
    // wrong theme on reload. The full theme module (js/theme.js) takes
    // over from here once the page finishes loading.
    try {
      var savedTheme = localStorage.getItem("ggo-theme");
      if (savedTheme && savedTheme !== "default") {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="header-row">
        <div>
          <h1>GradingGridOnline</h1>
          <p class="subtitle">Courses &amp; class rosters</p>
        </div>
        <div class="settings-wrap">
          <button id="settings-btn" class="btn btn-ghost btn-small" aria-label="Settings" title="Settings">⚙ Settings</button>
          <div id="settings-panel" class="settings-panel" hidden>
            <h3>Theme</h3>
            <ul id="theme-list" class="theme-list"></ul>
          </div>
        </div>
      </div>
    </header>

    <main class="card">
      <div class="auth-row">
        <span id="auth-status" class="status">Loading…</span>
        <div class="auth-buttons">
          <button id="sign-in-btn" class="btn btn-primary" hidden>Sign in with Google</button>
          <button id="sign-out-btn" class="btn btn-ghost" hidden>Sign out</button>
        </div>
      </div>

      <!-- ===== Course list view ===== -->
      <section id="course-section" class="app-section" hidden>
        <div class="section-header">
          <h2>Your courses</h2>
          <span id="course-count" class="count-badge"></span>
        </div>

        <ul id="course-list" class="course-list"></ul>

        <div id="add-course-row" class="add-course-row">
          <input id="new-course-name" type="text" placeholder="New course name (e.g. English Composition 1)" />
          <button id="add-course-btn" class="btn btn-primary">+ Add Course</button>
        </div>
        <p id="course-status" class="result"></p>
      </section>

      <!-- ===== Course detail (one course): Roster + Seating Chart tabs ===== -->
      <section id="course-detail-section" class="app-section" hidden>
        <button id="back-to-courses-btn" class="btn btn-ghost btn-small">← All Courses</button>

        <div class="section-header">
          <h2 id="course-detail-title">Course</h2>
        </div>

        <div class="tab-row">
          <button id="tab-roster-btn" class="tab-btn tab-btn-active">Roster</button>
          <button id="tab-seating-btn" class="tab-btn">Seating Chart</button>
        </div>

        <!-- ----- Roster panel ----- -->
        <div id="roster-panel" class="tab-panel">
          <div class="panel-toolbar">
            <span id="roster-count" class="count-badge"></span>
            <div class="panel-toolbar-buttons">
              <input id="roster-file-input" type="file" accept=".csv,.xlsx,.xls" hidden />
              <button id="upload-roster-btn" class="btn btn-ghost">Upload CSV / Excel</button>
              <button id="add-student-btn" class="btn btn-ghost">+ Add Student</button>
              <button id="save-roster-btn" class="btn btn-primary">Save Roster</button>
            </div>
          </div>

          <!-- Column-mapping step, shown right after a file is chosen -->
          <div id="mapping-panel" class="mapping-panel" hidden>
            <h3>Match your file's columns</h3>
            <p class="hint" id="mapping-hint"></p>
            <div class="mapping-row">
              <label>Name column</label>
              <select id="map-name"></select>
            </div>
            <div class="mapping-row">
              <label>School ID column</label>
              <select id="map-schoolid"></select>
            </div>
            <div class="mapping-row">
              <label>Pronunciation column</label>
              <select id="map-pronunciation"></select>
            </div>
            <div class="mapping-buttons">
              <button id="confirm-import-btn" class="btn btn-primary">Import (replaces current roster)</button>
              <button id="cancel-import-btn" class="btn btn-ghost">Cancel</button>
            </div>
          </div>

          <table class="roster-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>School ID</th>
                <th>Pronunciation</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="roster-tbody"></tbody>
          </table>

          <p id="roster-status" class="result"></p>
        </div>

        <!-- ----- Seating chart panel ----- -->
        <div id="seating-panel" class="tab-panel" hidden>
          <div class="panel-toolbar">
            <div class="grid-size-controls">
              <label>Rows</label>
              <select id="grid-rows"></select>
              <label>Columns</label>
              <select id="grid-cols"></select>
              <button id="apply-grid-size-btn" class="btn btn-ghost btn-small">Apply Size</button>
            </div>
            <div class="panel-toolbar-buttons">
              <button id="auto-fill-btn" class="btn btn-ghost">Auto-Fill</button>
              <button id="clear-seating-btn" class="btn btn-ghost">Clear Seating</button>
              <button id="save-seating-btn" class="btn btn-primary">Save Seating Chart</button>
            </div>
          </div>

          <p class="hint">Click a student below, then click a desk to seat them. Click a seated desk to remove that student.</p>

          <div class="seating-layout">
            <aside class="unseated-panel">
              <h3>Unseated <span id="unseated-count" class="count-badge"></span></h3>
              <ul id="unseated-list" class="unseated-list"></ul>
            </aside>
            <div id="seating-grid" class="seating-grid"></div>
          </div>

          <p id="seating-status" class="result"></p>
        </div>
      </section>
    </main>
  </div>

  <!-- Google Identity Services (sign-in) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- SheetJS (reads .csv / .xlsx / .xls files) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/storage/storage-provider.js"></script>
  <script src="js/storage/googledrive-provider.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/courses.js"></script>
  <script src="js/roster.js"></script>
  <script src="js/roster-import.js"></script>
  <script src="js/seating.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
