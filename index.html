<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>Classroom Manager</h1>
      <p class="subtitle">Foundation build — sign-in &amp; Google Drive save/load</p>
    </header>

    <main class="card">
      <div class="auth-row">
        <span id="auth-status" class="status">Loading…</span>
        <div class="auth-buttons">
          <button id="sign-in-btn" class="btn btn-primary" hidden>Sign in with Google</button>
          <button id="sign-out-btn" class="btn btn-ghost" hidden>Sign out</button>
        </div>
      </div>

      <section id="test-section" class="test-section" hidden>
        <h2>Save/load test</h2>
        <p class="hint">
          Type something below, save it to your Google Drive, then reload the page
          and load it back — this confirms the storage layer works end to end
          before any real features get built on top of it.
        </p>
        <textarea id="notes-input" rows="4" placeholder="Type a test note here…"></textarea>
        <div class="test-buttons">
          <button id="save-btn" class="btn btn-primary">Save to Google Drive</button>
          <button id="load-btn" class="btn btn-ghost">Load from Google Drive</button>
        </div>
        <p id="test-result" class="result"></p>
      </section>
    </main>
  </div>

  <!-- MSAL.js — handles Microsoft sign-in -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="js/config.js"></script>
  <script src="js/storage/storage-provider.js"></script>
  <script src="js/storage/googledrive-provider.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
