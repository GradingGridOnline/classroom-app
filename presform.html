<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Presentation scores</title>
  <style>
    :root {
      --paper: #f6f5f1; --ink: #2b2a28; --ink-soft: #6b6560; --green: #2f5233; --green-dark: #223d26;
      --line: #ddd8cd; --card: #ffffff; --bad: #b3261e; --good: #1e7a3c; --chip: #eef3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
      font: 17px/1.5 -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      display: flex; align-items: flex-start; justify-content: center; padding: 20px 12px 60px;
    }
    .card { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 22px 18px 22px; }
    h1 { font: 700 1.3rem Georgia, "Times New Roman", serif; color: var(--green-dark); margin: 0 0 4px; }
    .sub { color: var(--ink-soft); margin: 0 0 18px; font-size: 0.95rem; }
    label.big { display: block; font-weight: 600; margin: 0 0 6px; }
    input[type=text] { width: 100%; font: inherit; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
    textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); min-height: 70px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(47, 82, 51, .18); }
    .row { margin-bottom: 16px; }
    .hint { color: var(--ink-soft); font-size: 0.88rem; margin: 6px 0 0; }
    button.primary { width: 100%; font: inherit; font-weight: 600; padding: 13px; border: 0; border-radius: 8px; background: var(--green); color: #fff; cursor: pointer; }
    button.primary:disabled { opacity: .55; cursor: default; }
    button.link { background: none; border: 0; color: var(--green); font: inherit; font-size: 0.9rem; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 6px; }
    .msg { min-height: 1.4em; margin: 0 0 14px; font-size: 0.95rem; }
    .msg.bad { color: var(--bad); }
    .instr { background: var(--chip); border-radius: 8px; padding: 10px 12px; margin: 0 0 18px; font-size: 0.95rem; white-space: pre-wrap; }
    .who { font-weight: 600; margin: 0 0 12px; }
    .block { border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 12px 4px; margin-bottom: 16px; }
    .block h2 { margin: 0 0 12px; font: 700 1.1rem Georgia, "Times New Roman", serif; color: var(--green-dark); }
    .q { margin-bottom: 14px; }
    .q .qt { font-weight: 600; margin-bottom: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      min-width: 44px; height: 44px; padding: 0 8px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
      font: inherit; font-weight: 600; cursor: pointer;
    }
    .chip.on { background: var(--green); border-color: var(--green); color: #fff; }
    .ends { display: flex; justify-content: space-between; color: var(--ink-soft); font-size: 0.8rem; margin-top: 3px; }
    .done { text-align: center; padding: 10px 0 4px; }
    .done .tick { font-size: 3rem; color: var(--good); line-height: 1; }
    .done h2 { margin: 10px 0 6px; font-size: 1.2rem; }
    .done p { margin: 0; color: var(--ink-soft); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">Presentation scores</h1>
    <p id="sub" class="sub"></p>
    <p id="msg" class="msg" aria-live="polite"></p>

    <form id="id-form" novalidate hidden>
      <div class="row">
        <label class="big" for="school-id" id="id-label">Your School ID</label>
        <input id="school-id" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <p class="hint" id="id-hint">You need your School ID to continue.</p>
      </div>
      <button id="id-btn" class="primary" type="submit">Continue</button>
    </form>

    <form id="answer-form" novalidate hidden>
      <p class="who" id="who"></p>
      <div id="instr" class="instr"></div>
      <div id="questions"></div>
      <p id="missing" class="hint"></p>
      <button id="send-btn" class="primary" type="submit">Submit</button>
      <button id="change-id" class="link" type="button">That's not me / change ID</button>
    </form>

    <div id="done" class="done" hidden>
      <div class="tick">✓</div>
      <h2>Thank you!</h2>
      <p>Your answers have been saved. You can close this page.</p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script>
    (function () {
      const cfg = (typeof APP_CONFIG !== "undefined" && APP_CONFIG.supabase) || {};
      const token = new URLSearchParams(location.search).get("c") || "";
      const $ = (id) => document.getElementById(id);
      const msg = $("msg");

      const MESSAGES = {
        bad_id: "That School ID isn't on the list (for teachers: type a name not starting with #). Check it and try again.",
        no_group: "You aren't in a presentation group, so there is nothing for you to rate here. Ask your teacher.",
        closed: "This link isn't active any more. Ask your teacher for a new QR code.",
        slow_down: "Too many wrong tries just now. Please wait a minute and try again.",
        bad_answer: "Some answers weren't accepted. Reload the page and try again.",
        network: "Couldn't reach the server. Check your connection and try again.",
      };
      function say(text, bad) { msg.textContent = text || ""; msg.className = "msg" + (bad ? " bad" : ""); }

      async function rpc(fn, args) {
        const headers = { "Content-Type": "application/json", apikey: cfg.anonKey };
        if (String(cfg.anonKey).startsWith("eyJ")) headers.Authorization = "Bearer " + cfg.anonKey;
        const res = await fetch(cfg.url + "/rest/v1/rpc/" + fn, { method: "POST", headers, body: JSON.stringify(args) });
        if (!res.ok) throw new Error("http " + res.status);
        return res.json();
      }

      let kind = "";
      let schoolId = "";
      let form = null;      // what the server returned for this student
      let answers = {};     // audience: {group: {rubricId: n}}; peer: {studentId: n}
      let comments = {};    // audience: {group: text}
      let globalComment = "";

      function showStep(which) {
        $("id-form").hidden = which !== "id";
        $("answer-form").hidden = which !== "answer";
        $("done").hidden = which !== "done";
        $("sub").hidden = which === "done";
        if (which === "id") $("school-id").focus();
      }

      function chips(max, current, onPick) {
        const wrap = document.createElement("div");
        const row = document.createElement("div");
        row.className = "chips";
        for (let n = 0; n <= max; n++) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip" + (current === n ? " on" : "");
          b.textContent = String(n);
          b.addEventListener("click", () => {
            onPick(n);
            row.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === b));
            refreshMissing();
          });
          row.appendChild(b);
        }
        wrap.appendChild(row);
        const ends = document.createElement("div");
        ends.className = "ends";
        const lo = document.createElement("span"); lo.textContent = "0 = lowest";
        const hi = document.createElement("span"); hi.textContent = max + " = highest";
        ends.append(lo, hi);
        wrap.appendChild(ends);
        return wrap;
      }

      function commentBox(placeholder, value, onInput) {
        const t = document.createElement("textarea");
        t.maxLength = 1000;
        t.placeholder = placeholder;
        t.value = value || "";
        t.addEventListener("input", () => onInput(t.value));
        return t;
      }

      function renderQuestions() {
        const box = $("questions");
        box.textContent = "";
        const cfgForm = form.config || {};
        if (kind !== "peer") {
          (form.groups || []).forEach((g) => {
            const block = document.createElement("div");
            block.className = "block";
            const h = document.createElement("h2");
            h.textContent = "Group " + g;
            block.appendChild(h);
            answers[g] = answers[g] || {};
            (cfgForm.rubrics || []).forEach((r) => {
              const q = document.createElement("div");
              q.className = "q";
              const qt = document.createElement("div");
              qt.className = "qt";
              qt.textContent = r.text;
              q.appendChild(qt);
              q.appendChild(chips(r.points, answers[g][r.id], (n) => { answers[g][r.id] = n; }));
              block.appendChild(q);
            });
            if (cfgForm.comments) {
              const q = document.createElement("div");
              q.className = "q";
              q.appendChild(commentBox("Comment for Group " + g + " (optional)", comments[g], (v) => { comments[g] = v; }));
              block.appendChild(q);
            }
            box.appendChild(block);
          });
          if (cfgForm.comments && kind === "teacher") { // only teachers can write a comment for everyone
            const block = document.createElement("div");
            block.className = "block";
            const h = document.createElement("h2");
            h.textContent = "Comment for everyone (optional)";
            block.appendChild(h);
            const q = document.createElement("div");
            q.className = "q";
            q.appendChild(commentBox("Anything you want to say to the whole class", globalComment, (v) => { globalComment = v; }));
            block.appendChild(q);
            box.appendChild(block);
          }
        } else {
          (form.members || []).forEach((m) => {
            const block = document.createElement("div");
            block.className = "block";
            const h = document.createElement("h2");
            h.textContent = m.name;
            block.appendChild(h);
            const q = document.createElement("div");
            q.className = "q";
            const qt = document.createElement("div");
            qt.className = "qt";
            qt.textContent = "How much did " + m.name + " contribute?";
            q.appendChild(qt);
            q.appendChild(chips(cfgForm.highest || 10, answers[m.id], (n) => { answers[m.id] = n; }));
            block.appendChild(q);
            box.appendChild(block);
          });
        }
        refreshMissing();
      }

      function missingCount() {
        const cfgForm = form.config || {};
        let missing = 0;
        if (kind !== "peer") {
          (form.groups || []).forEach((g) => (cfgForm.rubrics || []).forEach((r) => { if (!(answers[g] && typeof answers[g][r.id] === "number")) missing++; }));
        } else {
          (form.members || []).forEach((m) => { if (typeof answers[m.id] !== "number") missing++; });
        }
        return missing;
      }

      function refreshMissing() {
        const n = missingCount();
        $("missing").textContent = n > 0 ? n + " answer(s) still to choose." : "";
        $("send-btn").disabled = n > 0;
      }

      $("id-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const value = $("school-id").value.trim();
        if (!value) { say($("id-label").textContent === "Your name" ? "Type your name." : "Type your School ID.", true); return; }
        $("id-btn").disabled = true; say("Checking…");
        try {
          const result = await rpc("pres_open", { p_token: token, p_school_id: value });
          if (result && result.status === "ok") {
            schoolId = value; form = result; kind = result.kind;
            answers = {}; comments = {}; globalComment = "";
            $("who").textContent = result.name ? "Hello, " + result.name : "";
            $("instr").textContent = (result.config && result.config.instructions) || "";
            $("instr").hidden = !$("instr").textContent;
            if (kind === "peer") $("sub").textContent = "Group " + result.group + " — rate your group members";
            say("");
            renderQuestions();
            showStep("answer");
            if (kind === "audience" && !(form.groups || []).length) say("There are no other groups to score.", true);
            if (kind === "peer" && !(form.members || []).length) say("You have no group members to rate.", true);
          } else {
            const code = result && result.status;
            say(MESSAGES[code] || MESSAGES.network, true);
            if (code === "closed") $("id-form").hidden = true;
          }
        } catch (err) {
          say(MESSAGES.network, true);
        } finally {
          $("id-btn").disabled = false;
        }
      });

      $("change-id").addEventListener("click", () => {
        schoolId = ""; form = null; say(""); showStep("id"); $("school-id").select();
      });

      $("answer-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (missingCount() > 0) return;
        let payload;
        if (kind !== "peer") payload = { scores: answers, comments: comments, global: globalComment };
        else payload = { ratings: answers };
        $("send-btn").disabled = true; say("Saving…");
        try {
          const result = await rpc("pres_submit", { p_token: token, p_school_id: schoolId, p_payload: payload });
          if (result === "ok") { say(""); showStep("done"); }
          else {
            say(MESSAGES[result] || MESSAGES.network, true);
            if (result === "bad_id") { schoolId = ""; showStep("id"); }
            if (result === "closed") $("answer-form").hidden = true;
          }
        } catch (err) {
          say(MESSAGES.network, true);
        } finally {
          refreshMissing();
        }
      });

      (async function start() {
        if (!token || !cfg.url) { say(MESSAGES.closed, true); return; }
        say("Loading…");
        try {
          const info = await rpc("pres_info", { p_token: token });
          if (!info) { say(MESSAGES.closed, true); return; }
          $("title").textContent = info.kind === "peer" ? "Rate your group members" : info.kind === "teacher" ? "Teacher scores" : "Score the presentations";
          if (info.kind === "teacher") { $("id-label").textContent = "Your name"; $("id-hint").textContent = "Type your name to continue."; $("change-id").textContent = "That's not me / change name"; }
          $("sub").textContent = info.title || "";
          document.title = $("title").textContent;
          say("");
          showStep("id");
        } catch (err) {
          say(MESSAGES.network, true);
        }
      })();
    })();
  </script>
</body>
</html>
